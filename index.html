<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="muteBtn" onclick="toggleMute()">🔊</button>
 
<div id="introOverlay">
  <div id="welcomeText">Welcome</div>
  <div id="nameStep">
    <div id="namePrompt">please type your name</div>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off">
    <button id="nameSubmit" onclick="submitName()">Continue →</button>
  </div>
</div>

<div id="scenery"></div>
 
<div class="card" id="card" style="visibility:hidden;">
 
  <!-- INTRO CAROUSEL -->
  <div class="screen active" id="introScreen">
    <div class="bear" id="introBear">🐻💙</div>
    <h1 id="introText"></h1>
    <p class="subtitle">click any flower floating around too 🌸</p>
    <button class="nextBtn" id="nextBtn" onclick="nextSlide()">Next →</button>
    <div class="dots" id="dots"></div>
  </div>
 

  <!-- WORD SCRAMBLE PUZZLE -->
  <div class="screen" id="puzzleScreen">
    <h1 style="min-height:auto;">Unscramble these before I ask you something 💙</h1>
    <div id="puzzleProgress">Word 1 of 5</div>
    <div id="puzzleHint"></div>
    <div id="answerSlots"></div>
    <div id="letterBank"></div>
    <div class="puzzle-actions">
      <button id="checkBtn" onclick="checkAnswer()">Check</button>
      <button id="clearBtn" onclick="clearAnswer()">Clear</button>
    </div>
    <div id="puzzleFeedback">&nbsp;</div>
  </div>

  

<script src="script.js"></script>
</body>
</html>
